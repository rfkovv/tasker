name: taskmaster
description: "TaskMaster — Flutter task manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Domain
  freezed_annotation: ^3.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
